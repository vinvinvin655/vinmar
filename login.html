<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviLearn - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">
                <h1>CiviLearn</h1>
            </div>
            <div class="auth-form">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <i class="fas fa-eye-slash toggle-password" data-target="loginPassword"></i>
                    </div>
                    <div class="remember-forgot">
                        <label>
                            <input type="checkbox" id="rememberMe"> Remember me
                        </label>
                        <a href="#" class="forgot-link" id="forgotPassword">Forgot Password?</a>
                    </div>
                    <button type="submit" class="auth-button">Login</button>
                </form>
                
               
                <div class="contributor-link-container" style="width: 100%; display: flex; justify-content: center; margin-top: 1.5rem; padding: 0.5rem 0;">
                    <div class="contributor-link" style="font-size: 0.75rem; color: #6c757d; position: relative; padding: 0.8rem 1.2rem; border-top: 1px solid rgba(108, 117, 125, 0.2); border-radius: 8px; text-align: center; width: 100%; max-width: 280px; background-color: rgba(248, 249, 250, 0.7); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);">
                        <p style="margin: 0; padding: 0; line-height: 1.4;">I'm a Contributor <a href="teacher-login.html" style="color: #000000; font-weight: 600; margin-left: 0.3rem;">Login here</a></p>
                    </div>
                </div>
                <div class="auth-switch">
                    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="auth.js"></script>
</body>
</html>
