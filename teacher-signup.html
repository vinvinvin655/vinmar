<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Signup - CiviLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a6bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .signup-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .signup-header h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .signup-header p {
            color: var(--secondary-color);
            margin-bottom: 0;
            font-size: 1.1rem;
        }

        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            border: 1px solid #e0e0e0;
            margin-bottom: 1.2rem;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(74, 107, 255, 0.25);
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #3a5bef;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 107, 255, 0.3);
        }

        .form-check {
            margin: 1rem 0;
        }

        .footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--secondary-color);
            font-size: 1rem;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .logo h2 {
            color: var(--primary-color);
            font-weight: 800;
            margin: 0;
        }
        
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--secondary-color);
        }
        
        .password-container {
            position: relative;
        }
        
        .form-row {
            display: flex;
            gap: 1rem;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .qualification-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e0e0e0;
        }
        
        .qualification-section h3 {
            font-size: 1.2rem;
            color: var(--dark-color);
            margin-bottom: 1rem;
        }
        
        .qualification-item {
            background-color: var(--light-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .qualification-item h4 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .qualification-item p {
            font-size: 0.9rem;
            color: var(--secondary-color);
            margin-bottom: 0;
        }
        
        .add-qualification {
            display: flex;
            align-items: center;
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 600;
            margin-top: 1rem;
        }
        
        .add-qualification i {
            margin-right: 0.5rem;
        }
        
        .social-signup {
            margin-top: 2rem;
            text-align: center;
        }
        
        .social-signup p {
            color: var(--secondary-color);
            margin-bottom: 1rem;
            position: relative;
        }
        
        .social-signup p::before,
        .social-signup p::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background-color: #e0e0e0;
        }
        
        .social-signup p::before {
            left: 0;
        }
        
        .social-signup p::after {
            right: 0;
        }
        
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e0e0e0;
            background-color: white;
            color: var(--secondary-color);
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .social-btn.google:hover {
            color: #DB4437;
        }
        
        .social-btn.facebook:hover {
            color: #4267B2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="signup-container">
            <div class="logo">
                <h2>CiviLearn</h2>
            </div>
            <div class="signup-header">
                <h1>Teacher Signup</h1>
                <p>Join our teaching community</p>
            </div>
            <form id="teacherSignupForm">
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" class="form-control" id="firstName" placeholder="First Name" required>
                    </div>
                    <div class="form-group">
                        <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <input type="email" class="form-control" id="email" placeholder="Email Address" required>
                </div>
                
                <div class="form-group">
                    <input type="text" class="form-control" id="phone" placeholder="Phone Number" required>
                </div>
                
                <div class="form-group">
                    <select class="form-control" id="specialization" required>
                        <option value="">Select Specialization</option>
                        <option value="structural">Structural Engineering</option>
                        <option value="transportation">Transportation Engineering</option>
                        <option value="environmental">Environmental Engineering</option>
                        <option value="geotechnical">Geotechnical Engineering</option>
                        <option value="water-resources">Water Resources Engineering</option>
                        <option value="construction">Construction Management</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <input type="text" class="form-control" id="institution" placeholder="Institution/University" required>
                </div>
                
                <div class="form-group">
                    <input type="text" class="form-control" id="yearsOfExperience" placeholder="Years of Teaching Experience" required>
                </div>
                
                <div class="password-container">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <i class="fas fa-eye-slash password-toggle" id="togglePassword"></i>
                </div>
                
                <div class="password-container">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                    <i class="fas fa-eye-slash password-toggle" id="toggleConfirmPassword"></i>
                </div>
                
                <div class="qualification-section">
                    <h3>Qualifications</h3>
                    <div id="qualifications-container">
                        <div class="qualification-item">
                            <h4>Degree</h4>
                            <p>Bachelor of Science in Civil Engineering</p>
                        </div>
                        <div class="qualification-item">
                            <h4>Certification</h4>
                            <p>Professional Engineer (PE) License</p>
                        </div>
                    </div>
                    <div class="add-qualification">
                        <i class="fas fa-plus-circle"></i>
                        <span>Add Qualification</span>
                    </div>
                </div>
                
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary">Create Teacher Account</button>
            </form>
            
            <div class="social-signup">
                <p>Or sign up with</p>
                <div class="social-buttons">
                    <a href="#" class="social-btn google">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="#" class="social-btn facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer">
        <p>Already have a teacher account? <a href="teacher-login.html">Sign in</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Toggle password visibility
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.classList.toggle('fa-eye');
                togglePassword.classList.toggle('fa-eye-slash');
            });
            
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            
            toggleConfirmPassword.addEventListener('click', () => {
                const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPasswordInput.setAttribute('type', type);
                toggleConfirmPassword.classList.toggle('fa-eye');
                toggleConfirmPassword.classList.toggle('fa-eye-slash');
            });
            
            // Handle form submission
            const teacherSignupForm = document.getElementById('teacherSignupForm');
            
            teacherSignupForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const email = document.getElementById('email').value;
                const phone = document.getElementById('phone').value;
                const specialization = document.getElementById('specialization').value;
                const institution = document.getElementById('institution').value;
                const yearsOfExperience = document.getElementById('yearsOfExperience').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const terms = document.getElementById('terms').checked;
                
                // Validate form
                if (password !== confirmPassword) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Password Mismatch',
                        text: 'Passwords do not match.',
                        confirmButtonColor: '#4a6bff'
                    });
                    return;
                }
                
                if (!terms) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Terms Not Accepted',
                        text: 'Please accept the Terms and Conditions.',
                        confirmButtonColor: '#4a6bff'
                    });
                    return;
                }
                
                // Get existing users
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // Check if email already exists
                if (users.some(user => user.email === email)) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Email Already Registered',
                        text: 'This email is already registered. Please use a different email or login.',
                        confirmButtonColor: '#4a6bff'
                    });
                    return;
                }
                
                // Create new teacher
                const newTeacher = {
                    id: 'teacher_' + Date.now(),
                    name: `${firstName} ${lastName}`,
                    email,
                    phone,
                    specialization,
                    institution,
                    yearsOfExperience,
                    password,
                    role: 'teacher',
                    createdAt: new Date().toISOString()
                };
                
                // Add teacher to users array
                users.push(newTeacher);
                localStorage.setItem('users', JSON.stringify(users));
                
                // Show success message and redirect
                Swal.fire({
                    icon: 'success',
                    title: 'Account Created!',
                    text: 'Your teacher account has been successfully created.',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'teacher-login.html';
                });
            });
            
            // Add qualification functionality
            const addQualificationBtn = document.querySelector('.add-qualification');
            const qualificationsContainer = document.getElementById('qualifications-container');
            
            addQualificationBtn.addEventListener('click', () => {
                Swal.fire({
                    title: 'Add Qualification',
                    html: `
                        <div class="form-group">
                            <input type="text" id="qualification-title" class="form-control" placeholder="Title (e.g., Degree, Certification)">
                        </div>
                        <div class="form-group">
                            <input type="text" id="qualification-details" class="form-control" placeholder="Details">
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Add',
                    confirmButtonColor: '#4a6bff',
                    preConfirm: () => {
                        const title = document.getElementById('qualification-title').value;
                        const details = document.getElementById('qualification-details').value;
                        
                        if (!title || !details) {
                            Swal.showValidationMessage('Please fill in all fields');
                            return false;
                        }
                        
                        return { title, details };
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const { title, details } = result.value;
                        
                        const qualificationItem = document.createElement('div');
                        qualificationItem.className = 'qualification-item';
                        qualificationItem.innerHTML = `
                            <h4>${title}</h4>
                            <p>${details}</p>
                        `;
                        
                        qualificationsContainer.appendChild(qualificationItem);
                    }
                });
            });
        });
    </script>
</body>
</html>
